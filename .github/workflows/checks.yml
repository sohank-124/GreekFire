name: Lightweight checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python research_report.py --self-test
      - run: python robustness_matrix.py --self-test
      - run: python risk_overlay_study.py --self-test
  julia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'import Pkg; Pkg.instantiate()'
      - run: julia --project=. examples/synthetic_pipeline.jl
      - run: julia --project=. test/runtests.jl
